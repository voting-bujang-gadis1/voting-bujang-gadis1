<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Bujang 2026</title>
    <style>
        :root { --primary: #0284c7; --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #bae6fd; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-gradient); margin: 0; color: var(--text-main); padding-bottom: 50px; }
        header { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; text-align: center; padding: 30px 20px; position: relative; }
        .back-btn { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.2); color: white; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        header h1 { font-size: 1.5rem; margin: 0 0 5px; } header p { margin: 0; font-size: 0.9rem; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); }
        .badge-no { font-weight: 800; font-size: 1.1rem; color: var(--primary); min-width: 30px; text-align: center; }
        img { width: 70px; height: 90px; object-fit: cover; border-radius: 10px; background: #e2e8f0; }
        .info-section { flex-grow: 1; } h3 { margin: 0 0 4px; font-size: 1.05rem; } .univ-text { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; } .vote-count { font-weight: 700; color: var(--primary); }
        .action-box { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        input { width: 50px; padding: 6px; text-align: center; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
    <!-- SCRIPT MIDTRANS SANDBOX -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="CLIENT_KEY_SANDBOX_ANDA"></script> 
</head>
<body>
    <header>
        <a href="/" class="back-btn">← Kembali</a>
        <h1>Pemilihan Bujang 2026</h1>
        <p>Dukung finalis Bujang favoritmu!</p>
    </header>
    <div class="container" id="finalis-container">Memuat data...</div>

    <script>
        async function loadFinalis() {
            const res = await fetch('/api/finalis?kategori=bujang');
            const data = await res.json();
            const container = document.getElementById('finalis-container');
            container.innerHTML = ''; 
            data.forEach((finalis, index) => {
                container.innerHTML += `
                    <div class="card">
                        <div class="badge-no">${finalis.nomor || (index + 1)}</div>
                        <img src="${finalis.foto}" alt="${finalis.nama}">
                        <div class="info-section">
                            <h3>${finalis.nama}</h3>
                            <div class="univ-text">Finalis Bujang</div>
                            <div class="vote-count">${finalis.vote} Votes</div>
                        </div>
                        <div class="action-box">
                            <input type="number" id="input-${finalis.id}" value="1" min="1">
                            <button onclick="bayarVote('${finalis.id}')">Vote</button>
                        </div>
                    </div>`;
            });
        }

        async function bayarVote(idFinalis) {
            const qty = document.getElementById(`input-${idFinalis}`).value;
            const nama = prompt("Masukkan Nama Anda:") || "Pendukung";
            const res = await fetch('/api/bayar-vote', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_finalis: idFinalis, jumlah_vote: qty, nama_voter: nama })
            });
            const data = await res.json();
            if (data.token) {
                window.snap.pay(data.token, {
                    onSuccess: function() { alert("Sukses!"); window.location.href = '/vote-bujang.html'; },
                    onPending: function() { alert("Menunggu bayaran."); window.location.href = '/vote-bujang.html'; },
                    onError: function() { alert("Gagal!"); },
                    onClose: function() { loadFinalis(); }
                });
            } else { alert("Gagal mengambil token Midtrans."); }
        }
        loadFinalis();
    </script>
</body>
</html>
