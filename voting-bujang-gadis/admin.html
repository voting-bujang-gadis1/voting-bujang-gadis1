<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Bujang Gadis 2026</title>
    <style>
        :root {
            --primary: #0284c7; --bg-gradient: #f0f9ff; --card-bg: #ffffff;
            --text-main: #0f172a; --border: #bae6fd;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
        h2 { margin-top: 0; color: var(--primary); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0369a1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #e0f2fe; color: var(--primary); }
        .btn-delete { background: #ef4444; padding: 6px 12px; width: auto; font-size: 0.8rem; }
        .btn-delete:hover { background: #dc2626; }
        img.preview { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Panel Admin</h1>
        <p>Kelola Data Finalis Bujang Gadis 2026</p>
    </header>

    <!-- Form Tambah Finalis dengan Upload File -->
    <div class="card">
        <h2>Tambah Finalis Baru</h2>
        <form id="formTambah">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Contoh: Budi Santoso">
            </div>
            <div class="form-group">
                <label>Nomor Finalis</label>
                <input type="text" id="nomor" required placeholder="Contoh: 01">
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select id="kategori" required>
                    <option value="bujang">Bujang</option>
                    <option value="gadis">Gadis</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pilih Foto Finalis (Dari Komputer/HP)</label>
                <input type="file" id="fotoFile" accept="image/*" required>
            </div>
            <button type="submit" id="btnSimpan">Simpan Finalis</button>
        </form>
    </div>

    <!-- Tabel Daftar Finalis -->
    <div class="card">
        <h2>Daftar Finalis</h2>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Foto</th>
                    <th>Nama</th>
                    <th>Kategori</th>
                    <th>Total Vote</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelFinalis">
                <!-- Data akan dimuat di sini -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadAdminFinalis() {
        try {
            const res = await fetch('/api/finalis');
            const data = await res.json();
            const tbody = document.getElementById('tabelFinalis');
            tbody.innerHTML = '';

            data.forEach(finalis => {
                tbody.innerHTML += `
                    <tr>
                        <td>${finalis.nomor}</td>
                        <td><img src="${finalis.foto}" class="preview"></td>
                        <td>${finalis.nama}</td>
                        <td style="text-transform: capitalize;">${finalis.kategori}</td>
                        <td><strong>${finalis.vote}</strong></td>
                        <td>
                            <button class="btn-delete" onclick="hapusFinalis('${finalis._id}')">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Gagal memuat data", error);
        }
    }

    document.getElementById('formTambah').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.innerText = "Mengunggah foto & menyimpan...";
        btnSimpan.disabled = true;

        const fileInput = document.getElementById('fotoFile').files[0];
        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        
        reader.onload = async function () {
            const base64Image = reader.result.split(',')[1]; 

            const formData = new FormData();
            formData.append("image", base64Image);

            try {
                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=2568130731f6be7ce0c8213fe11141aa`, {
                    method: 'POST',
                    body: formData
                });
                const imgbbData = await imgbbRes.json();

                if (!imgbbData.success) {
                    throw new Error("Gagal mengunggah foto ke server.");
                }

                const fotoUrl = imgbbData.data.url;

                const dataBaru = {
                    nama: document.getElementById('nama').value,
                    nomor: document.getElementById('nomor').value,
                    kategori: document.getElementById('kategori').value,
                    foto: fotoUrl
                };

                const res = await fetch('/api/finalis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataBaru)
                });

                if (res.ok) {
                    alert("Finalis dan foto berhasil ditambahkan!");
                    document.getElementById('formTambah').reset();
                    loadAdminFinalis();
                } else {
                    alert("Gagal menyimpan data ke database.");
                }
            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan saat memproses gambar.");
            } finally {
                btnSimpan.innerText = "Simpan Finalis";
                btnSimpan.disabled = false;
            }
        };
    });

    async function hapusFinalis(id) {
        if (confirm("Apakah Anda yakin ingin menghapus finalis ini?")) {
            try {
                const res = await fetch(`/api/finalis/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("Finalis dihapus!");
                    loadAdminFinalis();
                }
            } catch (error) {
                alert("Gagal menghapus data.");
            }
        }
    }

    loadAdminFinalis();
</script>

</body>
</html>
