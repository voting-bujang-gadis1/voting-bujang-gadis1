<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Bujang Gadis 2026</title>
    
    <!-- SCRIPT MIDTRANS SANDBOX -->
    <script type="text/javascript"
            src="https://app.sandbox.midtrans.com/snap/snap.js"
            data-client-key="SB-Mid-client-J0bLntU0o8QdZkI9"></script>

    <style>
        :root { --primary: #0284c7; --bg-main: #e0f2fe; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); }
        
        .card { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #bae6fd; }
        .nomor { font-size: 1.5rem; font-weight: bold; color: var(--primary); width: 40px; text-align: center; }
        .foto { width: 70px; height: 90px; object-fit: cover; border-radius: 10px; margin-right: 15px; background: #e2e8f0; }
        .info { flex-grow: 1; }
        .info h3 { margin: 0 0 5px 0; font-size: 1.2rem; color: #1e293b; }
        .kategori { margin: 0 0 5px 0; font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
        .vote-count { margin: 0; font-weight: bold; color: var(--primary); }
        
        .action-area { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .input-vote { width: 60px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 1rem; }
        .btn-vote { background: var(--primary); color: white; border: none; padding: 6px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn-vote:hover { background: #0369a1; }
        .btn-profil { background: #f8fafc; color: var(--primary); border: 1px solid var(--primary); padding: 4px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; font-size: 0.85rem;}
        .btn-profil:hover { background: #e0f2fe; }

        /* DESAIN POPUP MODAL PROFIL */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 25px; border-radius: 15px; width: 85%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #000; }
        .modal-foto { width: 120px; height: 150px; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto 15px auto; }
        .modal-title { text-align: center; color: var(--primary); margin: 0 0 5px 0; }
        .modal-sub { text-align: center; color: #64748b; font-size: 0.9rem; text-transform: uppercase; margin: 0 0 20px 0; }
        .modal-section { margin-bottom: 15px; }
        .modal-section h4 { margin: 0 0 5px 0; color: #334155; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .modal-section p { margin: 0; color: #475569; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>Daftar Finalis</h1>
    <div id="listFinalis">
        <p style="text-align: center;">Memuat data...</p>
    </div>
</div>

<!-- KOTAK POPUP (MODAL) BIODATA -->
<div id="modalProfil" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="tutupModal()">&times;</span>
        <img id="mFoto" src="" class="modal-foto">
        <h2 id="mNama" class="modal-title">Nama</h2>
        <p id="mKategori" class="modal-sub">Kategori</p>
        
        <div class="modal-section">
            <h4>Biodata Singkat</h4>
            <p id="mBiodata">-</p>
        </div>
        <div class="modal-section">
            <h4>Visi & Misi</h4>
            <p id="mVisiMisi">-</p>
        </div>
    </div>
</div>

<script>
    // Menyimpan data finalis agar bisa dipanggil ke modal tanpa loading lagi
    let dataFinalisGlobal = [];

    async function loadVotingFinalis() {
        try {
            const res = await fetch('/api/finalis');
            dataFinalisGlobal = await res.json();
            const list = document.getElementById('listFinalis');
            list.innerHTML = '';

            dataFinalisGlobal.forEach((finalis, index) => {
                const inputId = `jumlah_vote_${finalis._id}`;
                const fotoAman = finalis.foto ? finalis.foto : '';
                const fotoHTML = fotoAman 
                    ? `<img src="${fotoAman}" class="foto">` 
                    : `<div class="foto" style="display:flex; align-items:center; justify-content:center; font-size:10px; color:gray;">No Foto</div>`;

                list.innerHTML += `
                    <div class="card">
                        <div class="nomor">${finalis.nomor}</div>
                        ${fotoHTML}
                        <div class="info">
                            <h3>${finalis.nama}</h3>
                            <p class="kategori">FINALIS ${finalis.kategori}</p>
                            <p class="vote-count">${finalis.vote || 0} Votes</p>
                        </div>
                        <div class="action-area">
                            <input type="number" id="${inputId}" class="input-vote" value="1" min="1">
                            <button class="btn-vote" onclick="prosesPembayaran('${finalis._id}', '${inputId}')">Vote</button>
                            <button class="btn-profil" onclick="bukaModal(${index})">Profil</button>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            document.getElementById('listFinalis').innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>';
        }
    }

    // FUNGSI MEMBUKA POPUP BIODATA
    function bukaModal(index) {
        const finalis = dataFinalisGlobal[index];
        document.getElementById('mFoto').src = finalis.foto || '';
        document.getElementById('mNama').innerText = finalis.nama;
        document.getElementById('mKategori').innerText = "Finalis " + finalis.kategori;
        document.getElementById('mBiodata').innerText = finalis.biodata || "Belum ada biodata.";
        document.getElementById('mVisiMisi').innerText = finalis.visiMisi || "Belum ada visi & misi.";
        
        document.getElementById('modalProfil').style.display = 'block';
    }

    function tutupModal() {
        document.getElementById('modalProfil').style.display = 'none';
    }

    // Tutup popup kalau user klik area hitam di luar kotak
    window.onclick = function(event) {
        const modal = document.getElementById('modalProfil');
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    async function prosesPembayaran(idFinalis, inputId) {
        const jumlahVote = document.getElementById(inputId).value;
        if (jumlahVote < 1) { alert("Jumlah vote minimal 1"); return; }

        try {
            const res = await fetch('/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ finalisId: idFinalis, jumlah: jumlahVote })
            });
            const data = await res.json();

            if (data.token) {
                window.snap.pay(data.token, {
                    onSuccess: function(result) {
                        alert("Pembayaran Berhasil! Vote ditambahkan.");
                        window.location.reload();
                    },
                    onPending: function(result) {
                        alert("Menunggu pembayaran Anda!");
                        window.location.reload();
                    },
                    onError: function(result) {
                        alert("Pembayaran Gagal.");
                        window.location.reload();
                    },
                    onClose: function() {
                        alert("Halaman ditutup sebelum pembayaran selesai.");
                    }
                });
            } else { alert("Gagal mendapatkan token server."); }
        } catch (error) { alert("Terjadi kesalahan jaringan."); }
    }

    loadVotingFinalis();
</script>
</body>
</html>
