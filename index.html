<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Bujang & Gadis 2026</title>
    <style>
        :root {
            --primary: #0284c7; --primary-hover: #0369a1; --primary-light: #e0f2fe;
            --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.12);
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-gradient); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; text-align: center; padding: 40px 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        header h1 { font-size: 1.8rem; margin: 0 0 10px; font-weight: 800; }
        header p { margin: 0; opacity: 0.95; }
        .main-container { max-width: 480px; width: 100%; margin: -25px auto 30px; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .category-card { background: var(--card-bg); border-radius: 20px; padding: 25px; text-align: center; box-shadow: var(--shadow); text-decoration: none; color: var(--text-main); position: relative; overflow: hidden; border: 1px solid rgba(186, 230, 253, 0.6); transition: transform 0.3s; }
        .category-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--primary); }
        .category-card:hover { transform: translateY(-6px); border-color: var(--primary); }
        .category-card h2 { margin: 0 0 6px; font-size: 1.35rem; }
        .category-card p { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 20px; }
        .btn-vote { display: block; background: var(--primary-light); color: var(--primary); padding: 12px; border-radius: 12px; font-weight: 700; transition: background 0.2s; }
        .category-card:hover .btn-vote { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <header>
        <h1>Bujang & Gadis 2026</h1>
        <p>Pilih kategori dan berikan dukungan terbaikmu!</p>
    </header>
    <div class="main-container">
        <a href="/vote-bujang.html" class="category-card">
            <h2>Pemilihan Bujang</h2>
            <p>Dukung finalis Bujang favorit pilihan Anda</p>
            <div class="btn-vote">Pilih Kategori Bujang</div>
        </a>
        <a href="/vote-gadis.html" class="category-card">
            <h2>Pemilihan Gadis</h2>
            <p>Dukung finalis Gadis favorit pilihan Anda</p>
            <div class="btn-vote">Pilih Kategori Gadis</div>
        </a>
    </div>
</body>
</html>
