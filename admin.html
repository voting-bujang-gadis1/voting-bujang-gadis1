<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Bujang Gadis 2026</title>
    <style>
        :root {
            --primary: #0284c7; --bg-gradient: #f0f9ff; --card-bg: #ffffff;
            --text-main: #0f172a; --border: #bae6fd;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
        h2 { margin-top: 0; color: var(--primary); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0369a1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #e0f2fe; color: var(--primary); }
        .btn-delete { background: #ef4444; padding: 6px 12px; width: auto; font-size: 0.8rem; }
        .btn-delete:hover { background: #dc2626; }
        .btn-reset { background: #991b1b; padding: 8px 15px; }
        .btn-reset:hover { background: #7f1d1d; }
        img.preview { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Panel Admin</h1>
        <p>Kelola Data dan Foto Finalis</p>
    </header>

    <div class="card">
        <h2>Tambah Finalis Baru</h2>
        <form id="formTambah">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" required>
            </div>
            <div class="form-group">
                <label>Nomor Finalis</label>
                <input type="text" id="nomor" required>
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select id="kategori" required>
                    <option value="bujang">Bujang</option>
                    <option value="gadis">Gadis</option>
                </select>
            </div>
            <div class="form-group">
                <label style="color: #0284c7;">Pilih File Foto (Otomatis Upload):</label>
                <input type="file" id="fotoFile" accept="image/*" required style="background: #e0f2fe; padding: 10px; cursor: pointer;">
            </div>
            <button type="submit" id="btnSimpan">Simpan Finalis</button>
        </form>
    </div>

    <div class="card">
        <h2 style="display: flex; justify-content: space-between; align-items: center;">
            Daftar Finalis
            <button class="btn-reset" onclick="resetDatabase()" style="width: auto; font-size: 0.8rem;">⚠️ Reset Semua Data</button>
        </h2>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Foto</th>
                    <th>Nama</th>
                    <th>Kategori</th>
                    <th>Vote</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelFinalis"></tbody>
        </table>
    </div>
</div>

<script>
    async function loadAdminFinalis() {
        try {
            const res = await fetch('/api/finalis');
            const data = await res.json();
            const tbody = document.getElementById('tabelFinalis');
            tbody.innerHTML = '';

            data.forEach(finalis => {
                const idAman = finalis._id || finalis.id; 
                const fotoAman = (finalis.foto && finalis.foto.includes('http')) ? finalis.foto : '';
                
                let fotoHTML = fotoAman 
                    ? `<img src="${fotoAman}" class="preview">` 
                    : `<span style="color:red; font-size: 10px; font-weight:bold;">Upload Gagal</span>`;

                let aksiHTML = idAman 
                    ? `<button class="btn-delete" onclick="hapusFinalis('${idAman}')">Hapus</button>`
                    : `<span style="color:red; font-size: 10px;">Data Cacat</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td>${finalis.nomor}</td>
                        <td>${fotoHTML}</td>
                        <td>${finalis.nama}</td>
                        <td style="text-transform: capitalize;">${finalis.kategori}</td>
                        <td><strong>${finalis.vote || 0}</strong></td>
                        <td>${aksiHTML}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Gagal memuat data", error);
        }
    }

    document.getElementById('formTambah').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.innerText = "Mengunggah Foto (Mohon Tunggu)...";
        btnSimpan.disabled = true;

        try {
            const fileInput = document.getElementById('fotoFile').files[0];
            const formData = new FormData();
            formData.append("image", fileInput);

            const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=2568130731f6be7ce0c8213fe11141aa`, {
                method: 'POST', 
                body: formData
            });
            
            const imgbbData = await imgbbRes.json();
            
            if (!imgbbData.success) {
                throw new Error("Gagal mengunggah foto ke ImgBB.");
            }

            const dataBaru = {
                nama: document.getElementById('nama').value,
                nomor: document.getElementById('nomor').value,
                kategori: document.getElementById('kategori').value,
                foto: imgbbData.data.url
            };

            const res = await fetch('/api/finalis', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataBaru)
            });

            if (res.ok) {
                alert("Sukses! Data & Foto berhasil disimpan.");
                document.getElementById('formTambah').reset();
                loadAdminFinalis(); 
            } else {
                alert("Gagal menyimpan data ke server.");
            }
        } catch (error) {
            console.error(error);
            alert("Terjadi kesalahan saat upload. Pastikan file gambar valid.");
        } finally {
            btnSimpan.innerText = "Simpan Finalis";
            btnSimpan.disabled = false;
        }
    });

    async function hapusFinalis(id) {
        if (confirm("Hapus finalis ini?")) {
            try {
                const res = await fetch(`/api/finalis/${id}`, { method: 'DELETE' });
                if (res.ok) loadAdminFinalis();
            } catch (error) {
                alert("Gagal menghapus data.");
            }
        }
    }

    async function resetDatabase() {
        if (confirm("Yakin ingin menghapus seluruh data?")) {
            try {
                const res = await fetch(`/api/reset`, { method: 'DELETE' });
                if (res.ok) loadAdminFinalis();
            } catch (error) {
                alert("Gagal mereset server.");
            }
        }
    }

    loadAdminFinalis();
</script>
</body>
</html>
