<script>
    async function loadAdminFinalis() {
        try {
            const res = await fetch('/api/finalis');
            const data = await res.json();
            const tbody = document.getElementById('tabelFinalis');
            tbody.innerHTML = '';

            data.forEach(finalis => {
                const idAman = finalis._id || finalis.id; 
                const fotoAman = (finalis.foto && finalis.foto.includes('http')) ? finalis.foto : '';
                
                // Jika foto gagal terkirim, akan muncul tulisan merah "Upload Gagal"
                let fotoHTML = fotoAman 
                    ? `<img src="${fotoAman}" class="preview">` 
                    : `<span style="color:red; font-size: 10px; font-weight:bold;">Upload Gagal</span>`;

                let aksiHTML = idAman 
                    ? `<button class="btn-delete" onclick="hapusFinalis('${idAman}')">Hapus</button>`
                    : `<span style="color:red; font-size: 10px;">Data Cacat</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td>${finalis.nomor}</td>
                        <td>${fotoHTML}</td>
                        <td>${finalis.nama}</td>
                        <td style="text-transform: capitalize;">${finalis.kategori}</td>
                        <td><strong>${finalis.vote || 0}</strong></td>
                        <td>${aksiHTML}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Gagal memuat data", error);
        }
    }

    document.getElementById('formTambah').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.innerText = "Mengunggah Foto (Mohon Tunggu)...";
        btnSimpan.disabled = true;

        try {
            // METODE BARU: Langsung mengirim file utuh ke ImgBB, lebih stabil!
            const fileInput = document.getElementById('fotoFile').files[0];
            const formData = new FormData();
            formData.append("image", fileInput);

            // Upload ke ImgBB
            const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=2568130731f6be7ce0c8213fe11141aa`, {
                method: 'POST', 
                body: formData
            });
            
            const imgbbData = await imgbbRes.json();
            
            if (!imgbbData.success) {
                throw new Error("Gagal mengunggah foto. Pastikan internet stabil.");
            }

            // Simpan ke database kita
            const dataBaru = {
                nama: document.getElementById('nama').value,
                nomor: document.getElementById('nomor').value,
                kategori: document.getElementById('kategori').value,
                foto: imgbbData.data.url
            };

            const res = await fetch('/api/finalis', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataBaru)
            });

            if (res.ok) {
                alert("Sukses! Data & Foto berhasil disimpan.");
                document.getElementById('formTambah').reset();
                loadAdminFinalis(); 
            } else {
                alert("Foto berhasil, tapi gagal menyimpan data ke database.");
            }
        } catch (error) {
            console.error(error);
            alert(error.message || "Terjadi kesalahan saat mengunggah foto.");
        } finally {
            btnSimpan.innerText = "Simpan Finalis";
            btnSimpan.disabled = false;
        }
    });

    async function hapusFinalis(id) {
        if (confirm("Hapus finalis ini?")) {
            try {
                const res = await fetch(`/api/finalis/${id}`, { method: 'DELETE' });
                if (res.ok) loadAdminFinalis();
            } catch (error) {
                alert("Gagal menghapus data.");
            }
        }
    }

    async function resetDatabase() {
        if (confirm("Yakin ingin menghapus seluruh data?")) {
            try {
                const res = await fetch(`/api/reset`, { method: 'DELETE' });
                if (res.ok) loadAdminFinalis();
            } catch (error) {
                alert("Gagal mereset server.");
            }
        }
    }

    loadAdminFinalis();
</script>
