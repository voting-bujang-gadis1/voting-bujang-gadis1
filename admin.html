<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Upload Foto</title>
    <style>
        body { font-family: sans-serif; background: #f0f9ff; padding: 20px; color: #0f172a; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #bae6fd; border-radius: 8px; box-sizing: border-box; }
        button { background: #0284c7; color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <h2>Tambah Finalis (Upload Foto Otomatis)</h2>
    <form id="formTambah">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" required>
        </div>
        <div class="form-group">
            <label>Nomor Finalis</label>
            <input type="text" id="nomor" required>
        </div>
        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori">
                <option value="bujang">Bujang</option>
                <option value="gadis">Gadis</option>
            </select>
        </div>
        <div class="form-group">
            <label style="color: #0284c7;">Pilih File Foto dari Perangkat:</label>
            <input type="file" id="fotoFile" accept="image/*" required style="background: #e0f2fe; padding: 10px;">
        </div>
        <button type="submit" id="btnSimpan">Simpan Finalis</button>
    </form>
</div>

<script>
    document.getElementById('formTambah').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.innerText = "Mengunggah foto...";
        btn.disabled = true;

        const fileInput = document.getElementById('fotoFile').files[0];
        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        
        reader.onload = async function () {
            const base64Image = reader.result.split(',')[1];
            const formData = new FormData();
            formData.append("image", base64Image);

            try {
                // Upload ke ImgBB menggunakan API Key Anda
                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=2568130731f6be7ce0c8213fe11141aa`, {
                    method: 'POST',
                    body: formData
                });
                const imgbbData = await imgbbRes.json();
                if (!imgbbData.success) throw new Error("Gagal upload gambar");

                const fotoUrl = imgbbData.data.url;

                const dataBaru = {
                    nama: document.getElementById('nama').value,
                    nomor: document.getElementById('nomor').value,
                    kategori: document.getElementById('kategori').value,
                    foto: fotoUrl
                };

                const res = await fetch('/api/finalis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataBaru)
                });

                if (res.ok) {
                    alert("Berhasil disimpan!");
                    document.getElementById('formTambah').reset();
                } else {
                    alert("Gagal simpan ke database.");
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan.");
            } finally {
                btn.innerText = "Simpan Finalis";
                btn.disabled = false;
            }
        };
    });
</script>
</body>
</html>
